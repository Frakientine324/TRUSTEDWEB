openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: apps
    description: Appory marketplace listings
  - name: buy-via-contacts
    description: Appory marketplace Buy via contact options
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /apps:
    get:
      operationId: listApps
      tags: [apps]
      summary: List app listings
      description: Returns marketplace listings shared across the app.
      responses:
        "200":
          description: App listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/App"
        "503":
          description: Shared storage unavailable
    post:
      operationId: createApp
      tags: [apps]
      summary: Create an app listing
      description: Creates a listing when the admin access header is valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Invalid listing
        "401":
          description: Admin access required
        "409":
          description: Duplicate listing
        "500":
          description: Listing could not be saved
  /apps/{id}:
    patch:
      operationId: updateApp
      tags: [apps]
      summary: Update an app listing
      description: Updates a listing when the admin access header is valid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInput"
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/App"
        "400":
          description: Invalid listing
        "401":
          description: Admin access required
        "404":
          description: Listing not found
        "500":
          description: Listing could not be updated
    delete:
      operationId: deleteApp
      tags: [apps]
      summary: Delete an app listing
      description: Deletes a listing when the admin access header is valid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted listing
        "401":
          description: Admin access required
        "404":
          description: Listing not found
        "500":
          description: Listing could not be deleted
  /buy-via-contacts:
    get:
      operationId: listBuyViaContacts
      tags: [buy-via-contacts]
      summary: List Buy via contact options
      description: Returns the contact options shown on app detail pages.
      responses:
        "200":
          description: Buy via contact options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuyViaContact"
        "503":
          description: Shared contact storage unavailable
    post:
      operationId: createBuyViaContact
      tags: [buy-via-contacts]
      summary: Add a Buy via contact option
      description: Adds a contact option when the admin access header is valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyViaContactInput"
      responses:
        "201":
          description: Created contact option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyViaContact"
        "400":
          description: Invalid contact option
        "401":
          description: Admin access required
        "409":
          description: Duplicate contact option
        "500":
          description: Contact option could not be saved
  /buy-via-contacts/{id}:
    delete:
      operationId: deleteBuyViaContact
      tags: [buy-via-contacts]
      summary: Remove a Buy via contact option
      description: Removes a contact option when the owner removal code is valid.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted contact option
        "400":
          description: Invalid contact option
        "401":
          description: Owner removal code required
        "404":
          description: Contact option not found
        "500":
          description: Contact option could not be removed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    App:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        publisher:
          type: string
        category:
          type: string
          enum: [Productivity, Entertainment, Utilities, Creative]
        description:
          type: string
        detail:
          type: string
        price:
          type: number
        size:
          type: string
        version:
          type: string
        initials:
          type: string
        iconBg:
          type: string
        iconFg:
          type: ["string", "null"]
        imageDataUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - publisher
        - category
        - description
        - detail
        - price
        - size
        - version
        - initials
        - iconBg
    AppInput:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        publisher:
          type: string
        category:
          type: string
          enum: [Productivity, Entertainment, Utilities, Creative]
        description:
          type: string
        detail:
          type: string
        price:
          type: number
        size:
          type: string
        version:
          type: string
        initials:
          type: string
        iconBg:
          type: string
        iconFg:
          type: ["string", "null"]
        imageDataUrl:
          type: ["string", "null"]
      required:
        - id
        - name
        - publisher
        - category
        - description
        - detail
        - price
        - size
        - version
        - initials
        - iconBg
    BuyViaContact:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
      required:
        - id
        - label
        - url
    BuyViaContactInput:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
          format: uri
      required:
        - label
        - url

